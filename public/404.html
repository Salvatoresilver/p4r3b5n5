<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>⛓️ Redirecionando... 🖤</title>
  <script>
    // GitHub Pages SPA redirect
    // Redireciona qualquer rota 404 de volta para o index.html
    var pathSegmentsToKeep = 1;
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body>
  <div style="background:#0a0000;color:#8b0000;display:flex;align-items:center;justify-content:center;height:100vh;font-family:serif;">
    <p>⛓️ Redirecionando... 🖤</p>
  </div>
</body>
</html>
